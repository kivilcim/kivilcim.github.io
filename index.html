  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script

eter coast.<\u002Fh3><p>Cliffside paths, small villages, and time to take the long way back.<\u002Fp>\n            <button class=\"save\" aria-pressed=\"false\" id=\"save\">Save this journey&nbsp; +<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"story\">\n      <div class=\"scope\"><div class=\"mono\">Design exploration<\u002Fdiv><p>Journey mapping · Mobile UX<br>Art direction · Interaction design<\u002Fp><\u002Fdiv>\n      <div><div class=\"mono\">The question<\u002Fdiv><p class=\"q\">What if finding a trip felt more like discovering a place—and less like filling out a form?<\u002Fp><\u002Fdiv>\n      <div><div class=\"mono\">The direction<\u002Fdiv><p class=\"d\">Lead with atmosphere. Reveal useful details gradually. Make saving a journey feel effortless.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 Folio -->\n  <section class=\"wrap project\" id=\"folio\" aria-labelledby=\"t3\">\n    <div class=\"p-top\">\n      <div class=\"p-meta mono\"><span><strong class=\"project-status concept\">Concept · Not shipped<\u002Fstrong> 03 / Folio<span>Culture / Digital product<\u002Fspan><\u002Fdiv>\n      <div class=\"p-title\"><h2 class=\"p\" id=\"t3\">A little less scrolling. A little more reading.<\u002Fh2><svg class=\"il ill in\" sc-camel-view-box=\"0 0 220 120\" aria-hidden=\"true\"><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M110 98V50M110 50C92 40 66 40 46 48v46c20-8 46-8 64 4 18-12 44-12 64-4V48c-20-8-46-8-64 2z\" transform=\"translate(0 6)\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M110 50L110 10\" style=\"--i:4\" opacity=\".6\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M110 50L70 18\" style=\"--i:5\" opacity=\".6\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M110 50L150 22\" style=\"--i:6\" opacity=\".6\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M150 22L180 40\" style=\"--i:7\" opacity=\".6\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M70 18L40 34\" style=\"--i:8\" opacity=\".6\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M70 18L110 10\" style=\"--i:9\" opacity=\".6\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M110 10L150 22\" style=\"--i:10\" opacity=\".6\"><\u002Fpath><circle sc-camel-path-length=\"1\" class=\"dot pop\" cx=\"70\" cy=\"18\" r=\"3\" style=\"--i:8\"><\u002Fcircle><circle sc-camel-path-length=\"1\" class=\"dot pop\" cx=\"110\" cy=\"10\" r=\"3\" style=\"--i:9\"><\u002Fcircle><circle sc-camel-path-length=\"1\" class=\"dot pop\" cx=\"150\" cy=\"22\" r=\"3\" style=\"--i:10\"><\u002Fcircle><circle sc-camel-path-length=\"1\" class=\"dot pop\" cx=\"180\" cy=\"40\" r=\"3\" style=\"--i:11\"><\u002Fcircle><circle sc-camel-path-length=\"1\" class=\"dot pop\" cx=\"40\" cy=\"34\" r=\"3\" style=\"--i:12\"><\u002Fcircle><\u002Fsvg><a class=\"ring go\" href=\"#folio\" aria-label=\"Folio case study (coming soon)\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" aria-hidden=\"true\"><path d=\"M8 20 20 8M9 8h11v11\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stage folio light\">\n      <div class=\"paper\">\n        <div class=\"fnav\"><span class=\"logo\">folio.<\u002Fspan><div><a href=\"#folio\">Discover<\u002Fa><a href=\"#folio\">Your library<\u002Fa><a href=\"#folio\">Reading notes<\u002Fa><\u002Fdiv><a href=\"#folio\">Your space ↗<\u002Fa><\u002Fdiv>\n        <div class=\"feature\"><div class=\"copy\"><span class=\"kick\">For the curious mind<\u002Fspan><h3>Good books.<br>Unexpected connections.<\u002Fh3><p>A place to follow your curiosity, collect what stays with you, and find your next good read.<\u002Fp><a href=\"#folio\">Explore the collection ↗<\u002Fa><\u002Fdiv>\n          <div class=\"still\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"chead\"><b>A different way of seeing<\u002Fb><a href=\"#folio\">View collection ↗<\u002Fa><\u002Fdiv>\n        <div class=\"books\">\n          <div class=\"book\"><div class=\"cover\" style=\"background:oklch(0.782 0.017 91.589)\"><b>Ways of<br>Seeing<\u002Fb><small>John Berger<\u002Fsmall><\u002Fdiv><div><h4>Ways of Seeing<\u002Fh4><p>John Berger<\u002Fp><button class=\"shelf\" aria-pressed=\"false\">+ Add to your shelf<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n          <div class=\"book\"><div class=\"cover\" style=\"background:oklch(0.332 0.008 137.804);color:oklch(0.933 0.014 97.45)\"><b>A Room of<br>One’s Own<\u002Fb><small>Virginia Woolf<\u002Fsmall><\u002Fdiv><div><h4>A Room of One’s Own<\u002Fh4><p>Virginia Woolf<\u002Fp><button class=\"shelf\" aria-pressed=\"false\">+ Add to your shelf<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n          <div class=\"book\"><div class=\"cover\" style=\"background:oklch(0.863 0.018 92.705)\"><b>The Art of<br>Noticing<\u002Fb><small>Rob Walker<\u002Fsmall><\u002Fdiv><div><h4>The Art of Noticing<\u002Fh4><p>Rob Walker<\u002Fp><button class=\"shelf\" aria-pressed=\"false\">+ Add to your shelf<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"story\">\n      <div class=\"scope\"><div class=\"mono\">Design exploration<\u002Fdiv><p>Information architecture · Web UX<br>Visual design · Component system<\u002Fp><\u002Fdiv>\n      <div><div class=\"mono\">The question<\u002Fdiv><p class=\"q\">How can a reading platform support curiosity without turning discovery into an endless feed?<\u002Fp><\u002Fdiv>\n      <div><div class=\"mono\">The direction<\u002Fdiv><p class=\"d\">Curated entry points, a personal shelf, and a tactile editorial system that puts the books first.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"approach\" id=\"approach\" aria-labelledby=\"ap\"><div class=\"wrap in-ap\">\n    <div class=\"row\"><div class=\"mono\">How I think / How I make<\u002Fdiv><h2 class=\"a\" id=\"ap\">Good design starts<br>with better questions.<\u002Fh2><\u002Fdiv>\n    <div class=\"steps\">\n      <div class=\"step\"><svg class=\"il stepil in\" sc-camel-view-box=\"0 0 160 80\" aria-hidden=\"true\"><circle class=\"dot\" cx=\"14\" cy=\"16\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"44\" cy=\"16\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"74\" cy=\"16\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"104\" cy=\"16\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"134\" cy=\"16\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"14\" cy=\"40\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"44\" cy=\"40\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"74\" cy=\"40\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"104\" cy=\"40\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"134\" cy=\"40\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"14\" cy=\"64\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"44\" cy=\"64\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"74\" cy=\"64\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"104\" cy=\"64\" r=\"2\"><\u002Fcircle><circle class=\"dot\" cx=\"134\" cy=\"64\" r=\"2\"><\u002Fcircle><g class=\"lens\"><circle cx=\"0\" cy=\"0\" r=\"16\"><\u002Fcircle><path d=\"M11 11l10 10\"><\u002Fpath><\u002Fg><\u002Fsvg><span class=\"mono\">01<\u002Fspan><h3>Observe closely.<\u002Fh3><p>Start with the people, the context, and the friction. Frame the right problem before reaching for a solution.<\u002Fp><small>Questions / Journeys / Opportunity<\u002Fsmall><\u002Fdiv>\n      <div class=\"step\"><svg class=\"il stepil in\" sc-camel-view-box=\"0 0 160 80\" aria-hidden=\"true\"><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M12 20L60 16 62 62 10 66Z\" stroke-dasharray=\".02 .03\" opacity=\".6\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M10 22L58 18 64 60 12 64Z\" style=\"--i:1\" opacity=\".4\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M70 40h18m-5-5 5 5-5 5\" style=\"--i:3\"><\u002Fpath><rect sc-camel-path-length=\"1\" data-d=\"\" x=\"98\" y=\"12\" width=\"52\" height=\"56\" rx=\"3\" style=\"--i:4\"><\u002Frect><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M106 28h36M106 38h24\" style=\"--i:5\"><\u002Fpath><rect sc-camel-path-length=\"1\" class=\"ub\" data-d=\"\" x=\"106\" y=\"50\" width=\"22\" height=\"9\" rx=\"2\" style=\"--i:6\"><\u002Frect><\u002Fsvg><span class=\"mono\">02<\u002Fspan><h3>Interpret into form.<\u002Fh3><p>Turn possibilities into flows and prototypes. Explore broadly, then make the trade-offs visible.<\u002Fp><small>Flows / Prototypes / Feedback<\u002Fsmall><\u002Fdiv>\n      <div class=\"step\"><svg class=\"il stepil in\" sc-camel-view-box=\"0 0 160 80\" aria-hidden=\"true\"><path d=\"M10 60C30 10 40 70 70 30S110 80 150 20\"><animate sc-camel-attribute-name=\"d\" values=\"M10 60C30 10 40 70 70 30S110 80 150 20;M10 60C40 10 70 20 80 40S120 70 150 20;M10 60C30 10 40 70 70 30S110 80 150 20\" sc-camel-key-times=\"0;.5;1\" dur=\"7s\" sc-camel-repeat-count=\"indefinite\" sc-camel-calc-mode=\"spline\" sc-camel-key-splines=\".5 0 .2 1;.5 0 .2 1\"><\u002Fanimate><\u002Fpath><rect x=\"7\" y=\"57\" width=\"6\" height=\"6\" class=\"dot\"><\u002Frect><rect x=\"147\" y=\"17\" width=\"6\" height=\"6\" class=\"dot\"><\u002Frect><\u002Fsvg><span class=\"mono\">03<\u002Fspan><h3>Communicate with meaning.<\u002Fh3><p>Test the idea, question the details, and build a consistent system. Keep what helps. Remove what doesn’t.<\u002Fp><small>Iteration / Systems / Handoff<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n  <section class=\"wrap about\" id=\"about\" aria-labelledby=\"ab\"><div class=\"row\"><div class=\"mono\">A little about me<\u002Fdiv><h2 class=\"a\" id=\"ab\">From Istanbul to London.<\u002Fh2><\u002Fdiv><div class=\"cols\"><figure class=\"portrait\"><svg class=\"pmark\" aria-hidden=\"true\"><use href=\"#kk\"><\u002Fuse><\u002Fsvg><figcaption class=\"mono\">London, UK<\u002Ffigcaption><\u002Ffigure><div class=\"copy1\"><p>Hello, I’m Kıvılcım, a product designer based in London.<\u002Fp><p>I grew up in Istanbul and worked for some of Turkey’s leading e-commerce and media companies. In 2020 I moved to the UK, where I ran my own agency until 2026.<\u002Fp><p>After years of designing products, I’ve grown more interested in visual authorship, perception, and computational exploration. I’m curious how human experience, natural and abstract systems, and visual communication connect. I use AI as a creative instrument, turning complex ideas into interactive experiences that carry meaning. I’m not chasing a recognisable aesthetic. I want a personal way of observing, interpreting, and communicating the world.<\u002Fp><p>Outside work, I run, swim, hike, and play basketball. My daughter and I talk about whatever we’re curious about, and we explore nature together. I read books, watch videos, and listen to podcasts on philosophy, science, and psychology. The nature of human consciousness fascinates me most. I love music across genres, from classical and jazz to rock, and Tool is my favorite band.<\u002Fp><\u002Fdiv><div><div class=\"mono\">Focus areas<\u002Fdiv><ul class=\"caps\"><li>Product thinking<\u002Fli><li>UX &amp; interaction design<\u002Fli><li>Visual &amp; interface design<\u002Fli><li>Design systems<\u002Fli><li>Prototyping<\u002Fli><li>Visual authorship<\u002Fli><li>Computational exploration<\u002Fli><\u002Ful><div class=\"toolstack\"><div class=\"mono\">Tools<\u002Fdiv><dl><div><dt>Design<\u002Fdt><dd>Figma · Paper · Affinity<\u002Fdd><\u002Fdiv><div><dt>Mapping<\u002Fdt><dd>Whimsical<\u002Fdd><\u002Fdiv><div><dt>AI<\u002Fdt><dd>Claude · ChatGPT · Gemini<\u002Fdd><\u002Fdiv><div><dt>Code<\u002Fdt><dd>GitHub<\u002Fdd><\u002Fdiv><\u002Fdl><\u002Fdiv><\u002Fdiv><\u002Fdiv><figure class=\"route\"><svg class=\"il in\" sc-camel-view-box=\"0 -40 1200 210\" role=\"img\" aria-label=\"Line drawing of the Istanbul skyline, with the Bosphorus Bridge, the Galata Tower and the Maiden’s Tower, and a plane flying across to the London skyline\"><path sc-camel-path-length=\"1\" data-d=\"\" d=\"M20 150H395M870 150H1180\" opacity=\".5\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" style=\"--i:1\" d=\"M20 128H280M90 150V60M220 150V60M20 124Q55 70 90 60Q155 108 220 60Q250 70 280 124M55 81V128M115 75V128M135 82V128M155 84V128M175 82V128M195 75V128M250 81V128M296 150V96h28v54M292 96l18-26 18 26M350 150q4-10 12-10h16q8 0 12 10M363 140V108h14v32M360 108h20M363 108a7 7 0 0 1 14 0M370 101V92\"><\u002Fpath><path class=\"rarc\" d=\"M176 40C420 -50 800 -50 1028 12\" stroke-dasharray=\"3 9\"><\u002Fpath><path sc-camel-path-length=\"1\" data-d=\"\" style=\"--i:9\" d=\"M900 150V70h30v80M896 70l19-34 19 34M915 36V22M1000 150L1030 24 1060 150M1015 100h30M1020 70h20M1090 150V96h14v54M1150 150V96h14v54M1086 96l11-14 11 14M1146 96l11-14 11 14M1104 108h46M1104 126Q1127 150 1150 126\"><\u002Fpath><circle sc-camel-path-length=\"1\" data-d=\"\" cx=\"915\" cy=\"88\" r=\"7\" style=\"--i:9\"><\u002Fcircle><path class=\"dot\" id=\"plane\" d=\"M14 0L4-3L-2-13H-6L-3-3L-10-2L-12-6H-15L-13 0L-15 6H-12L-10 2L-3 3L-6 13H-2L4 3Z\"><animateMotion begin=\"0s\" dur=\"10s\" sc-camel-repeat-count=\"1\" sc-camel-fill=\"freeze\" sc-camel-fill=\"freeze\" rotate=\"auto\" sc-camel-calc-mode=\"linear\" sc-camel-key-times=\"0;.3;.8;1\" sc-camel-key-points=\"0;0;1;1\" path=\"M176 40C420 -50 800 -50 1028 12\"><\u002FanimateMotion><animate sc-camel-attribute-name=\"opacity\" values=\"0;0;1;1;1;1\" sc-camel-key-times=\"0;.28;.32;.8;.88;1\" dur=\"10s\" sc-camel-repeat-count=\"1\" sc-camel-fill=\"freeze\"><\u002Fanimate><\u002Fpath><\u002Fsvg><figcaption class=\"labels mono\"><span>Istanbul · grew up<\u002Fspan><span>2020 · moved to the UK<\u002Fspan><span>London · based now<\u002Fspan><\u002Ffigcaption><\u002Ffigure><\u002Fsection>\n<\u002Fmain>\n\n<footer class=\"wrap contact\" id=\"contact\">\n  \n  <div class=\"invite\"><span class=\"mono\">Have something in mind?<\u002Fspan><p>A new idea, a tricky problem, or a different perspective. Let’s start a conversation.<\u002Fp><\u002Fdiv>\n  <div class=\"statement\"><a href=\"mailto:hi@kivilcim.uk\">Let’s make it matter.<\u002Fa><svg class=\"big-arrow\" sc-camel-view-box=\"0 0 96 96\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M26 70 70 26M30 26h40v40\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n  <div class=\"links\"><div><span class=\"mono\">Email<\u002Fspan><a href=\"mailto:hi@kivilcim.uk\">hi@kivilcim.uk<\u002Fa><\u002Fdiv><\u002Fdiv>\n  \n  <div class=\"foot\"><span class=\"sig\"><svg class=\"mark mark-s\" aria-hidden=\"true\" focusable=\"false\"><use href=\"#kk\"><\u002Fuse><\u002Fsvg>© 2026<\u002Fspan><span class=\"mono\">Thoughtfully considered. Always evolving.<\u002Fspan><a href=\"#top\">Back to top ↑<\u002Fa><\u002Fdiv>\n<\u002Ffooter>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:8000}}\">\nclass Component extends DCLogic {\nrenderVals() { return {}; }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"</script>
